<!doctype html>
<html lang="en" data-theme="phosphor" data-scanlines="off" data-motion="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A scientific calculator in pure TypeScript." />
    <title>Calculator</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00ff9c" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <script>
      // FOUC guard: apply the saved theme before first paint. Scanlines and
      // motion are permanently off, so they are not restored from storage.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("rb-theme") || "phosphor";
      } catch (e) {}
    </script>
    <script src="/retro.js" defer></script>
  </head>
  <body>
    <div class="app">
      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="drawer"
      >
        <span></span><span></span><span></span>
      </button>

      <section class="calc" aria-label="Calculator">
        <div class="display" role="group" aria-label="Calculator display">
          <math-field class="display__input" id="calc-input" aria-label="Expression"></math-field>
          <math-field
            class="display__result"
            id="calc-result"
            read-only
            aria-label="Result"
          ></math-field>
          <span class="visually-hidden" id="calc-announcer" role="status" aria-live="polite"></span>
        </div>
        <div class="keypad" id="keypad"></div>
      </section>
    </div>

    <dialog class="drawer" id="drawer" aria-label="Options and history">
      <div class="drawer__head">
        <h2 class="drawer__title">Options</h2>
        <button class="drawer__close" id="drawer-close" type="button" aria-label="Close menu">
          &times;
        </button>
      </div>

      <div class="drawer__section">
        <span class="drawer__label">Theme</span>
        <select data-theme-select aria-label="Theme"></select>
      </div>

      <div class="drawer__section">
        <span class="drawer__label">Angle</span>
        <div class="seg" role="group" aria-label="Angle unit">
          <button type="button" data-angle="rad" aria-pressed="true">Rad</button>
          <button type="button" data-angle="deg" aria-pressed="false">Deg</button>
        </div>
      </div>

      <div class="drawer__section">
        <span class="drawer__label">Result</span>
        <div class="seg" role="group" aria-label="Result format">
          <button type="button" data-format="exact" aria-pressed="true">Exact</button>
          <button type="button" data-format="decimal" aria-pressed="false">Decimal</button>
        </div>
      </div>

      <div class="drawer__section">
        <span class="drawer__label">History</span>
        <ul class="history" id="history"></ul>
        <button class="btn btn-sm" id="clear-history" type="button">Clear history</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
